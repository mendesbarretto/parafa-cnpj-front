services:
  frontend:
    container_name: cnpj-parafa-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-cnpj-parafa-frontend}:${IMAGE_TAG:-latest}
    mem_limit: ${MEMORY_LIMIT:-256m}
    mem_reservation: ${MEMORY_RESERVATION:-128m}
    cpus: ${CPU_LIMIT:-0.50}
    pids_limit: 128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cnpj-internal
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      API_URL: ${API_URL:-http://cnpj-api/api}
      NODE_OPTIONS: --max-old-space-size=128
      UV_THREADPOOL_SIZE: 2
      NEXT_PRIVATE_BUILD_WORKER: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cnpj-internal:
    external: true
    name: ${INTERNAL_NETWORK:-cnpj-internal}
